# A submission is an issue whose title names what it is -- `publish NAME
# RELEASE`, `admit NAME`, ... -- and whose body holds the signed entry
# `mind publish` or `mind index` made. This checks it the way every reader
# will, appends it, and closes the issue; or says why not. It is trusted with
# nothing: an entry it should not append would fail every reader's check.
name: Append
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
# No concurrency group: GitHub keeps one pending run per group and cancels
# the rest, which dropped submissions. Runs race instead, and the loser
# appends again on top of the winner -- which is always valid, since a
# signature never covers where its entry was placed.
jobs:
  append:
    if: >-
      startsWith(github.event.issue.title, 'publish ') || startsWith(github.event.issue.title, 'admit ') ||
      startsWith(github.event.issue.title, 'transfer ') || startsWith(github.event.issue.title, 'rotate ') ||
      startsWith(github.event.issue.title, 'yank ') || startsWith(github.event.issue.title, 'keepers')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libffi-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ hashFiles('ci/build-mind.sh') }}
      - run: sh ci/build-mind.sh
      # The body arrives through the environment, never in the script: it is
      # whatever the issue's author wrote.
      - env:
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.txt"
          git config user.name "dream-index"
          git config user.email "dream-index@users.noreply.github.com"
          # Appended to the newest log there is, and again if another run
          # pushed first.
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            if ! out=$(toolchain/build/bin/dream toolchain/mind.dream index append . "$RUNNER_TEMP/body.txt" 2>&1); then
              printf 'Not appended:\n\n```\n%s\n```\n\nEdit the issue to try again.\n' "$out" > "$RUNNER_TEMP/reply.md"
              gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"
              exit 0
            fi
            git add index.log
            git commit -qm "Append #$NUMBER: $(head -c 72 "$RUNNER_TEMP/body.txt" | tr -d '`\n')"
            if git push -q origin HEAD:main; then
              printf 'Appended.\n\n```\n%s\n```\n' "$out" > "$RUNNER_TEMP/reply.md"
              gh issue close "$NUMBER" --comment "$(cat "$RUNNER_TEMP/reply.md")"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "could not push after six attempts" >&2
          exit 1
